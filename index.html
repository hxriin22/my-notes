<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Notes</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#282824;--muted:#77776f;--line:#e7e7e1;--hover:#efefeb;--accent:#586b52;--danger:#b83b3b;--shadow:0 10px 35px #0000000b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;transition:background .15s,border-color .15s}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #87977d;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#465640}.danger{color:var(--danger)}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{background:#f0f0ec;border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;gap:15px}.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;padding:2px 6px}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#dfe5d9;color:#3f5637}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px}.section-title{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 8px;text-transform:uppercase}.page-list{display:flex;flex-direction:column;gap:3px}.page-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;min-width:0;cursor:pointer;border:1px solid transparent}.page-item:hover{background:#e8e8e2}.page-item.active{background:#fff;border-color:#e4e4dd;box-shadow:0 1px 2px #00000006}.page-item .emoji{flex:none}.page-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}.page-item .star{color:#8a7742}.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:7px}.small-note{font-size:11px;color:var(--muted);padding:4px 7px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:#ffffffa8}.crumb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;gap:7px;align-items:center}.mobile-menu{display:none}.editor-wrap{width:min(820px,100%);margin:0 auto;padding:52px 40px 80px;flex:1}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.page-icon{font-size:30px}.title-input{width:100%;border:0;background:transparent;font-size:clamp(27px,4vw,38px);font-weight:750;letter-spacing:-.04em;padding:3px 0;color:var(--text)}.title-input:focus{outline:none}.meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:26px}.save-dot{width:6px;height:6px;border-radius:50%;background:#71966b;display:inline-block}.editor{width:100%;min-height:52vh;resize:vertical;border:0;outline:none;background:transparent;font-size:16px;line-height:1.9;color:var(--text);padding:0;white-space:pre-wrap}.editor::placeholder{color:#aaa99f}.preview-label{font-size:12px;color:var(--muted);margin:26px 0 10px;font-weight:700}.preview{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 20px;min-height:100px;overflow-wrap:anywhere}.preview p{margin:0 0 10px}.preview ul,.preview ol{padding-left:25px;margin:8px 0 14px}.preview blockquote{border-left:3px solid #c8cec1;margin:12px 0;padding:4px 0 4px 14px;color:#666;font-style:italic}.preview .task{display:flex;align-items:flex-start;gap:9px;margin:7px 0}.preview .task input{margin-top:5px;accent-color:var(--accent)}.preview .math-block{overflow-x:auto;padding:8px 0}.preview .empty-preview{color:#aaa99f}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}.empty{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.empty h2{color:var(--text);font-size:23px}.empty p{max-width:330px}.status{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292d29;color:#fff;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.overlay{display:none}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;left:0;top:0;bottom:0;width:285px;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0005;z-index:4}.mobile-menu{display:inline-flex}.topbar{padding:0 13px}.editor-wrap{padding:32px 20px 55px}.top-actions .desktop-only{display:none}.title-input{font-size:29px}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark">✎</span><span>My Notes</span></div>
  <div class="side-actions"><button class="primary" id="newPageBtn">＋ 새 페이지</button><button id="newChecklistBtn">☑ 체크리스트</button></div>
  <input class="search" id="searchInput" type="search" placeholder="⌕ 페이지 검색..." aria-label="페이지 검색">
  <div><div class="section-title">즐겨찾기</div><div class="page-list" id="favoritesList"></div></div>
  <div><div class="section-title">모든 페이지</div><div class="page-list" id="pagesList"></div></div>
  <div class="side-bottom">
    <button id="exportBtn">↓ 노트 백업 내보내기</button>
    <button id="importBtn">↑ 백업 가져오기</button><input id="importFile" type="file" accept="application/json,.json" hidden>
    <div class="small-note">이 브라우저에 자동 저장됩니다.</div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="mobile-menu" id="menuBtn" aria-label="메뉴 열기">☰</button><div class="crumb" id="breadcrumb">내 공간</div></div><div class="top-actions"><button id="favoriteBtn" title="즐겨찾기">☆ 즐겨찾기</button><button class="desktop-only" id="renameBtn">이름 변경</button><button class="desktop-only danger" id="deleteBtn">삭제</button></div></header>
  <section class="editor-wrap" id="editorWrap"></section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]] },startup:{typeset:false}};window.addEventListener('load',()=>{const b=document.getElementById('contentPreview');if(b&&window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([b]).catch(()=>{});});</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'my-notes-app-v1';
  const $ = id => document.getElementById(id);
  const now = () => new Date().toISOString();
  const makePage = (title='새 페이지', content='') => ({id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)), title, content, favorite:false, createdAt:now(), updatedAt:now()});
  let state = {pages:[], activeId:null};
  let saveTimer = null, toastTimer = null;
  function load(){
    try { const raw=localStorage.getItem(STORAGE_KEY); if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed.pages)){state.pages=parsed.pages;state.activeId=parsed.activeId||null;}} } catch(e){ console.warn('노트 데이터를 읽지 못했습니다.',e); }
    if(!state.pages.length){const p=makePage('첫 번째 노트','여기에 자유롭게 기록해 보세요.\n\n왼쪽에서 새 페이지나 체크리스트를 만들 수 있어요.');state.pages.push(p);state.activeId=p.id;save();}
    if(!state.pages.some(p=>p.id===state.activeId))state.activeId=state.pages[0]?.id||null;
  }
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));setStatus('자동 저장됨');}catch(e){setStatus('저장 실패');notify('저장 공간이 부족하거나 브라우저 저장이 차단되었어요. 백업을 내보내 주세요.');}}
  function scheduleSave(){setStatus('저장 중…');clearTimeout(saveTimer);saveTimer=setTimeout(save,250);}
  function setStatus(s){const el=$('saveStatus');if(el)el.textContent=s;}
  function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}
  function activePage(){return state.pages.find(p=>p.id===state.activeId)||null;}
  function safeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function renderLists(){
    const q=$('searchInput').value.trim().toLowerCase();
    const filtered=state.pages.filter(p=>!q||(p.title+' '+p.content).toLowerCase().includes(q));
    const favs=filtered.filter(p=>p.favorite);$('favoritesList').innerHTML='';$('pagesList').innerHTML='';
    if(!favs.length){const e=document.createElement('div');e.className='small-note';e.textContent=q?'검색 결과 없음':'즐겨찾기가 없어요';$('favoritesList').append(e);}
    favs.forEach(p=>$('favoritesList').append(makePageItem(p)));
    if(!filtered.length){const e=document.createElement('div');e.className='small-note';e.textContent='일치하는 페이지가 없어요';$('pagesList').append(e);}
    filtered.forEach(p=>$('pagesList').append(makePageItem(p)));
  }
  function makePageItem(p){const row=document.createElement('div');row.className='page-item'+(p.id===state.activeId?' active':'');row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label',p.title+' 열기');const icon=document.createElement('span');icon.className='emoji';icon.textContent=p.title.startsWith('☑ ')?'☑':'▤';const name=document.createElement('span');name.className='name';name.textContent=p.title||'제목 없음';row.append(icon,name);if(p.favorite){const star=document.createElement('span');star.className='star';star.textContent='★';row.append(star);}row.addEventListener('click',()=>selectPage(p.id));row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPage(p.id);}});return row;}
  function renderEditor(){const p=activePage();const wrap=$('editorWrap');wrap.innerHTML='';if(!p){wrap.innerHTML='<div class="empty"><div><h2>아직 페이지가 없어요</h2><p>새 페이지 버튼을 눌러 첫 노트를 만들어 보세요.</p><button class="primary" id="emptyNewBtn">＋ 새 페이지</button></div></div>';$('emptyNewBtn').onclick=createPage;return;}
    $('breadcrumb').textContent=p.title||'제목 없음';
    const head=document.createElement('div');head.className='editor-head';const icon=document.createElement('span');icon.className='page-icon';icon.textContent=p.title.startsWith('☑ ')?'☑':'📝';const title=document.createElement('input');title.className='title-input';title.value=p.title.replace(/^☑ /,'');title.placeholder='제목 없음';title.setAttribute('aria-label','페이지 제목');title.addEventListener('input',()=>{p.title=(p.title.startsWith('☑ ')?'☑ ':'')+title.value;p.updatedAt=now();$('breadcrumb').textContent=p.title||'제목 없음';renderLists();scheduleSave();});head.append(icon,title);wrap.append(head);
    const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span class="save-dot"></span><span id="saveStatus">자동 저장됨</span><span>·</span><span>이 브라우저에 저장</span>';wrap.append(meta);
    const toolbar=document.createElement('div');toolbar.className='toolbar';const addButton=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);toolbar.append(b);};
    let editor;
    addButton('＋ 체크 항목',()=>insertAtCursor(editor,'- [ ] 할 일\n'));
    addButton('• 글머리 기호',()=>insertAtCursor(editor,'• '));
    addButton('1. 번호 목록',()=>insertAtCursor(editor,'1. '));
    addButton('❞ 인용',()=>insertAtCursor(editor,'> '));
    addButton('∑ LaTeX',()=>{const formula=prompt('LaTeX 수식을 입력하세요. 예: \\frac{a}{b}');if(formula!==null&&formula.trim())insertAtCursor(editor,'\n$$\n'+formula.trim()+'\n$$\n');});
    addButton('날짜 삽입',()=>insertAtCursor(editor,new Date().toLocaleDateString('ko-KR')+' '));wrap.append(toolbar);
    editor=document.createElement('textarea');editor.className='editor';editor.placeholder='생각을 자유롭게 기록하세요…\n\n위 도구로 체크 항목, 글머리 기호, 인용, LaTeX 수식을 추가할 수 있어요.';editor.value=p.content||'';editor.setAttribute('aria-label','노트 내용');editor.addEventListener('input',()=>{p.content=editor.value;p.updatedAt=now();scheduleSave();renderPreview(editor.value);if($('searchInput').value.trim())renderLists();});wrap.append(editor);
    const previewLabel=document.createElement('div');previewLabel.className='preview-label';previewLabel.textContent='미리보기 · 체크박스, 글머리 기호, 수식이 표시됩니다';wrap.append(previewLabel);const preview=document.createElement('div');preview.className='preview';preview.id='contentPreview';wrap.append(preview);renderPreview(editor.value);
    const hint=document.createElement('div');hint.className='status';hint.style.marginTop='12px';hint.textContent='LaTeX 수식은 ∑ LaTeX 버튼으로 추가할 수 있어요. 예: \\frac{a}{b}, x^2 + y^2 = z^2';wrap.append(hint);
    $('favoriteBtn').textContent=p.favorite?'★ 즐겨찾기 해제':'☆ 즐겨찾기';$('favoriteBtn').disabled=false;$('renameBtn').disabled=false;$('deleteBtn').disabled=false;
  }
  function render(){renderLists();renderEditor();}
  function selectPage(id){state.activeId=id;save();render();if(window.matchMedia('(max-width:720px)').matches)closeMenu();}
  function createPage(content='',title='새 페이지'){const p=makePage(title,content);state.pages.unshift(p);state.activeId=p.id;save();render();closeMenu();const input=document.querySelector('.title-input');if(input){input.focus();input.select();}notify('새 페이지를 만들었어요.');}
  function createChecklist(){createPage('- [ ] 첫 번째 할 일\n- [ ] 두 번째 할 일\n- [ ] 완료한 일은 [x]로 표시하세요.','☑ 체크리스트');}
  function renamePage(){const p=activePage();if(!p)return;const current=p.title.replace(/^☑ /,'');const next=prompt('새 페이지 이름을 입력하세요.',current);if(next===null)return;const trimmed=next.trim();if(!trimmed){notify('페이지 이름은 비워 둘 수 없어요.');return;}p.title=(p.title.startsWith('☑ ')?'☑ ':'')+trimmed;p.updatedAt=now();save();render();notify('페이지 이름을 바꿨어요.');}
  function deletePage(){const p=activePage();if(!p)return;if(!confirm('“'+p.title+'” 페이지를 삭제할까요? 이 작업은 되돌리기 어려워요.'))return;state.pages=state.pages.filter(x=>x.id!==p.id);state.activeId=state.pages[0]?.id||null;if(!state.pages.length){const n=makePage('첫 번째 노트','');state.pages.push(n);state.activeId=n.id;}save();render();notify('페이지를 삭제했어요.');}
  function toggleFavorite(){const p=activePage();if(!p)return;p.favorite=!p.favorite;save();render();notify(p.favorite?'즐겨찾기에 추가했어요.':'즐겨찾기에서 해제했어요.');}
  function insertAtCursor(editor,text){if(!editor||typeof editor.setRangeText!=='function')editor=document.querySelector('.editor');if(!editor)return;const start=editor.selectionStart??editor.value.length,end=editor.selectionEnd??start;editor.setRangeText(String(text),start,end,'end');editor.dispatchEvent(new Event('input',{bubbles:true}));editor.focus();}
  function renderPreview(source){const box=$('contentPreview');if(!box)return;box.innerHTML='';if(!source.trim()){box.innerHTML='<div class="empty-preview">작성한 내용이 여기에 표시됩니다.</div>';return;}const lines=source.split(/\r?\n/);let list=null;const closeList=()=>{if(list){box.append(list);list=null;}};const inline=(text)=>{let escaped=safeText(text);escaped=escaped.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');return escaped;};for(let i=0;i<lines.length;i++){const line=lines[i];if(/^\s*\$\$\s*$/.test(line)){closeList();let formulaLines=[];i++;while(i<lines.length&&!/^\s*\$\$\s*$/.test(lines[i])){formulaLines.push(lines[i]);i++;}const math=document.createElement('div');math.className='math-block';math.textContent='\\['+formulaLines.join('\n')+'\\]';box.append(math);continue;}const task=line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);if(task){if(list){closeList();}const row=document.createElement('label');row.className='task';const cb=document.createElement('input');cb.type='checkbox';cb.checked=task[1].toLowerCase()==='x';cb.addEventListener('change',()=>{const updated=lines.slice();updated[i]=updated[i].replace(/\[([ xX])\]/,cb.checked?'[x]':'[ ]');const ed=document.querySelector('.editor');if(ed){ed.value=updated.join('\n');ed.dispatchEvent(new Event('input',{bubbles:true}));}});const span=document.createElement('span');span.innerHTML=inline(task[2]);row.append(cb,span);box.append(row);continue;}const bullet=line.match(/^\s*[-*•]\s+(.*)$/);const numbered=line.match(/^\s*\d+[.)]\s+(.*)$/);if(bullet||numbered){const type=bullet?'ul':'ol';if(!list||list.tagName.toLowerCase()!==type){closeList();list=document.createElement(type);}const li=document.createElement('li');li.innerHTML=inline((bullet||numbered)[1]);list.append(li);continue;}closeList();if(!line.trim())continue;if(/^\s*>\s?/.test(line)){const q=document.createElement('blockquote');q.innerHTML=inline(line.replace(/^\s*>\s?/,''));box.append(q);continue;}const para=document.createElement('p');para.innerHTML=inline(line);box.append(para);}closeList();if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetClear?.([box]);window.MathJax.typesetPromise([box]).catch(()=>{});}}
  function exportBackup(){const blob=new Blob([JSON.stringify({format:'my-notes-backup',version:1,exportedAt:now(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-notes-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);notify('백업 파일을 내보냈어요.');}
  function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.pages)||!data.pages.every(p=>p&&typeof p.id==='string'&&typeof p.title==='string'))throw new Error('형식 오류');if(!confirm('현재 노트를 백업 파일의 내용으로 교체할까요? 먼저 현재 노트를 백업하는 것을 권장해요.'))return;state={pages:data.pages.map(p=>({id:p.id,title:p.title,content:String(p.content||''),favorite:!!p.favorite,createdAt:p.createdAt||now(),updatedAt:p.updatedAt||now()})),activeId:data.activeId||data.pages[0]?.id||null};if(!state.pages.length){const p=makePage();state.pages.push(p);state.activeId=p.id;}if(!state.pages.some(p=>p.id===state.activeId))state.activeId=state.pages[0].id;save();render();notify('백업을 가져왔어요.');}catch(e){notify('올바른 My Notes 백업 파일이 아니에요.');}};reader.readAsText(file);}
  function openMenu(){$('sidebar').classList.add('open');$('overlay').classList.add('show');}function closeMenu(){$('sidebar').classList.remove('open');$('overlay').classList.remove('show');}
  $('newPageBtn').addEventListener('click',()=>createPage());$('newChecklistBtn').addEventListener('click',createChecklist);$('renameBtn').addEventListener('click',renamePage);$('deleteBtn').addEventListener('click',deletePage);$('favoriteBtn').addEventListener('click',toggleFavorite);$('searchInput').addEventListener('input',renderLists);$('exportBtn').addEventListener('click',exportBackup);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{importBackup(e.target.files[0]);e.target.value='';});$('menuBtn').addEventListener('click',openMenu);$('overlay').addEventListener('click',closeMenu);
  load();render();
})();
</script>
</body>
</html>
