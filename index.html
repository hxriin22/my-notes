
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <style>
    body {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      font-family: sans-serif;
      background: #f7f7f5;
      color: #37352f;
    }
    textarea {
      width: 100%;
      height: 300px;
      padding: 16px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
    }
  </style>
</head>
<body>
  <h1>My Notes ✏️</h1>
  <p>나만의 노트 공간</p>
  <textarea id="note" placeholder="여기에 노트를 작성하세요."></textarea>
  <script>
    const note = document.getElementById("note");
    note.value = localStorage.getItem("my-note") || "";
    note.addEventListener("input", () => {
      localStorage.setItem("my-note", note.value);
    });
  </script>
</body>
</html>
