<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;transition:background .15s}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid #87977d;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#465640}.danger{color:var(--danger)}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{background:#f0f0ec;border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;gap:15px}.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;padding:2px 6px}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#dfe5d9;color:#3f5637}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px}.section-title{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 8px;text-transform:uppercase}.page-list{display:flex;flex-direction:column;gap:3px}.page-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;min-width:0;cursor:pointer;border:1px solid transparent}.page-item:hover{background:#e8e8e2}.page-item.active{background:#fff;border-color:#e4e4dd}.page-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}.page-item .star{color:#8a7742}.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:7px}.small-note{font-size:11px;color:var(--muted);padding:4px 7px}.main{min-width:0;display:flex;flex-direction:column}.topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 24px;border-bottom:1px solid var(--line);background:#ffffffa8}.crumb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{display:flex;gap:7px;align-items:center}.mobile-menu{display:none}.editor-wrap{width:min(900px,100%);margin:0 auto;padding:44px 40px 80px;flex:1}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.page-icon{font-size:30px}.title-input{width:100%;border:0;background:transparent;font-size:clamp(27px,4vw,38px);font-weight:750;letter-spacing:-.04em;padding:3px 0;color:var(--text)}.title-input:focus{outline:none}.meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-bottom:20px}.save-dot{width:6px;height:6px;border-radius:50%;background:#71966b;display:inline-block}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.toolbar button{font-size:13px;padding:7px 9px}.format-select{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--panel)}.format-select select{max-width:100px;border:0;background:transparent;color:var(--text);font:inherit;outline:none;padding:4px 0;cursor:pointer}.editor{width:100%;min-height:55vh;outline:none;background:transparent;font-size:16px;line-height:1.85;color:var(--text);padding:4px 0;overflow-wrap:anywhere}.editor:empty:before{content:attr(data-placeholder);color:#aaa99f;pointer-events:none}.editor p{margin:0 0 8px}.editor h1,.editor h2,.editor h3{line-height:1.35;margin:14px 0 8px}.editor h1{font-size:1.65em}.editor h2{font-size:1.35em}.editor h3{font-size:1.15em}.editor ul,.editor ol{padding-left:28px;margin:5px 0 12px}.editor blockquote{border-left:3px solid #c8cec1;margin:10px 0;padding:4px 0 4px 14px;color:#666}.task-row{display:flex;align-items:flex-start;gap:9px;margin:5px 0;min-height:28px}.task-row input{margin-top:7px;accent-color:var(--accent);width:15px;height:15px;flex:none}.task-text{min-width:10px;flex:1;outline:none}.task-row input:checked+.task-text{text-decoration:line-through;color:var(--muted)}.math-token{display:inline-block;background:#f0f1ed;border-radius:5px;padding:2px 5px;margin:0 2px;white-space:normal;max-width:100%;vertical-align:middle}.math-token .MathJax{outline:none}.empty{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.empty h2{color:var(--text);font-size:23px}.status{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292d29;color:#fff;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.overlay{display:none}

.auth-btn{white-space:nowrap}.auth-modal{display:none;position:fixed;inset:0;z-index:20;background:#0006;align-items:center;justify-content:center;padding:18px}.auth-modal.show{display:flex}.auth-card{background:var(--panel);width:min(430px,100%);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}.auth-card h2{margin:0 0 6px;font-size:23px}.auth-card p{color:var(--muted);font-size:13px}.auth-form{display:flex;flex-direction:column;gap:10px;margin-top:16px}.auth-form input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}.auth-actions{display:flex;gap:8px;margin-top:14px}.auth-actions button{flex:1}.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:12px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}.auth-message{font-size:12px;color:var(--muted);margin-top:12px;white-space:pre-wrap}.auth-message.error{color:var(--danger)}.cloud-note{font-size:11px;color:var(--muted);padding:2px 7px}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;left:0;top:0;bottom:0;width:285px;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0005;z-index:4}.mobile-menu{display:inline-flex}.topbar{padding:9px 13px}.editor-wrap{padding:28px 20px 55px}.top-actions .desktop-only{display:none}.title-input{font-size:29px}}

<div class="overlay" id="overlay"></div><div class="app">

<div><div class="section-title">즐겨찾기</div><div class="page-list" id="favoritesList"></div></div><div><div class="section-title">모든 페이지</div><div class="page-list" id="pagesList"></div></div>
<div class="side-bottom"><button id="exportBtn">↓ 노트 백업 내보내기</button><button id="importBtn">↑ 백업 가져오기</button><input id="importFile" type="file" accept="application/json,.json" hidden><div class="small-note">이 브라우저에 자동 저장됩니다.</div></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="mobile-menu" id="menuBtn" aria-label="메뉴 열기">☰</button><div class="crumb" id="breadcrumb">내 공간</div></div><div class="top-actions"><button class="auth-btn" id="authOpenBtn">로그인</button><button id="favoriteBtn" title="즐겨찾기">☆ 즐겨찾기</button><button class="desktop-only" id="renameBtn">이름 변경</button><button class="desktop-only danger" id="deleteBtn">삭제</button></div></header><section class="editor-wrap" id="editorWrap"></section></main></div><div class="auth-modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="auth-card"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 id="authTitle">My Notes 로그인</h2><button type="button" id="authCloseBtn" aria-label="닫기">✕</button></div><p id="authIntro">계정에 로그인하면 노트를 클라우드에 저장할 수 있어요.</p><div id="signedInPanel" hidden><p id="signedInText"></p><div class="auth-actions"><button class="primary" id="syncNowBtn" type="button">지금 동기화</button><button id="signOutBtn" type="button">로그아웃</button></div></div><div id="signedOutPanel"><p class="small-note">이메일과 비밀번호로 로그인하거나 새 계정을 만들 수 있어요.</p><form class="auth-form" id="emailAuthForm"><input id="authEmail" type="email" autocomplete="email" placeholder="이메일" required><input id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" minlength="6" required><button class="primary" id="emailSubmitBtn" type="submit">로그인</button></form><div class="auth-actions"><button id="authModeBtn" type="button">처음이신가요? 회원가입</button></div></div><div class="auth-message" id="authMessage" role="status">Firebase 설정을 완료한 뒤 로그인할 수 있어요.</div><p style="margin-bottom:0">노트는 이 브라우저에도 계속 저장되며, 로그인 시 클라우드 노트와 안전하게 병합됩니다.</p></div></div><div class="toast" id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
(()=>{'use strict';
const STORAGE_KEY='my-notes-app-v1', $=id=>document.getElementById(id), now=()=>new Date().toISOString();
// Firebase Console > Project settings > Your apps에서 실제 설정값으로 바꾸세요.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCUwGy8tf6euFYpF39nIyTi8y__NsvVVBM',
  authDomain: 'my-note-d5d71.firebaseapp.com',
  projectId: 'my-note-d5d71',
  appId: '1:889367673781:web:9784e1d011daa8962137fc',
  storageBucket: 'my-note-d5d71.firebasestorage.app',
  messagingSenderId: '889367673781',
  measurementId: 'G-M72EW9VNKW'
};
let firebaseReady=false,auth=null,db=null,cloudUser=null,cloudInitialized=false,cloudSaveTimer=null,authMode='signin';
function firebaseConfigured(){return FIREBASE_CONFIG.apiKey!=='YOUR_API_KEY'&&FIREBASE_CONFIG.projectId!=='YOUR_PROJECT_ID'&&FIREBASE_CONFIG.appId!=='YOUR_APP_ID'}
const makePage=(title='새 페이지',content='')=>({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),title,content,favorite:false,createdAt:now(),updatedAt:now()});
let state={pages:[],activeId:null},saveTimer=null,toastTimer=null,savedEditorRange=null;
function safeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.pages)){state.pages=d.pages;state.activeId=d.activeId||null;}}}catch(e){console.warn(e)}if(!state.pages.length){const p=makePage('첫 번째 노트','여기에 자유롭게 기록해 보세요.');state.pages=[p];state.activeId=p.id;save()}if(!state.pages.some(p=>p.id===state.activeId))state.activeId=state.pages[0]?.id||null;}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));setStatus(cloudUser&&cloudInitialized?'이 브라우저에 저장됨 · 클라우드 동기화 중':'이 브라우저에 자동 저장됨');if(cloudUser&&cloudInitialized)scheduleCloudSave()}catch(e){setStatus('저장 실패');notify('브라우저 저장 공간이 부족할 수 있어요. 노트를 백업해 주세요.')}}
function scheduleCloudSave(){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>writeCloudState().catch(e=>{console.error(e);setAuthMessage('클라우드 저장에 실패했어요. 인터넷과 Firebase 설정을 확인해 주세요. ('+(e.code||e.message||'오류')+')',true)}),900)}
async function writeCloudState(){if(!db||!cloudUser||!cloudInitialized)return;const snapshot=JSON.parse(JSON.stringify(state));await db.collection('users').doc(cloudUser.uid).collection('app').doc('main').set({...snapshot,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});const status=$('saveStatus');if(status)status.textContent='클라우드에 저장됨'}
function mergeStates(local,cloud){const byId=new Map();for(const p of [...(local.pages||[]),...(cloud.pages||[])]){const old=byId.get(p.id);if(!old||Date.parse(p.updatedAt||0)>=Date.parse(old.updatedAt||0))byId.set(p.id,{...p})}const pages=[...byId.values()].sort((a,b)=>Date.parse(b.updatedAt||0)-Date.parse(a.updatedAt||0));let activeId=cloud.activeId&&byId.has(cloud.activeId)?cloud.activeId:(local.activeId&&byId.has(local.activeId)?local.activeId:(pages[0]?.id||null));return {pages,activeId}}
function setAuthMessage(message,isError=false){const el=$('authMessage');if(el){el.textContent=message;el.classList.toggle('error',!!isError)}}
function openAuth(){ $('authModal').classList.add('show');setAuthMessage(firebaseConfigured()?'계정으로 로그인하면 노트를 안전하게 동기화할 수 있어요.':'아래 설정 안내를 따라 Firebase 설정값을 index.html에 입력해 주세요.');updateAuthUI() }
function closeAuth(){ $('authModal').classList.remove('show') }
function updateAuthUI(){const signed=!!cloudUser;$('authOpenBtn').textContent=signed?'계정 · '+(cloudUser.displayName||cloudUser.email||'로그인됨'):'로그인';$('signedInPanel').hidden=!signed;$('signedOutPanel').hidden=signed;if(signed)$('signedInText').textContent=(cloudUser.displayName||cloudUser.email||'로그인됨')+'\n클라우드 동기화가 활성화되어 있어요.';if(!firebaseConfigured()){$('emailSubmitBtn').disabled=true;$('authModeBtn').disabled=true;setAuthMessage('Firebase 설정이 아직 필요합니다. 아래 안내에 따라 프로젝트 설정값을 입력해 주세요.')}else{$('emailSubmitBtn').disabled=false;$('authModeBtn').disabled=false;$('emailSubmitBtn').textContent=authMode==='signup'?'회원가입':'로그인';$('authModeBtn').textContent=authMode==='signup'?'이미 계정이 있나요? 로그인':'처음이신가요? 회원가입'}}
async function afterSignIn(user){cloudUser=user;cloudInitialized=false;updateAuthUI();setAuthMessage('노트를 확인하고 병합하는 중…');try{const ref=db.collection('users').doc(user.uid).collection('app').doc('main');const snap=await ref.get();const local=JSON.parse(JSON.stringify(state));if(snap.exists){const cloud=snap.data();state=mergeStates(local,cloud);notify('브라우저와 클라우드 노트를 병합했어요.')}else{state=local;await ref.set({...JSON.parse(JSON.stringify(state)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});notify('기존 브라우저 노트를 클라우드로 복사했어요.')}if(!state.pages.length){const p=makePage('첫 번째 노트','');state={pages:[p],activeId:p.id}}if(!state.pages.some(p=>p.id===state.activeId))state.activeId=state.pages[0]?.id||null;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));cloudInitialized=true;render();await writeCloudState();setAuthMessage('로그인 및 동기화가 완료됐어요. 기존 브라우저 노트도 그대로 보존됩니다.');}catch(e){console.error(e);cloudInitialized=false;setAuthMessage('로그인은 됐지만 노트를 동기화하지 못했어요. Firebase Firestore 설정과 보안 규칙을 확인해 주세요. ('+(e.code||e.message||'오류')+')',true)}updateAuthUI()}
async function initializeFirebase(){if(!firebaseConfigured()){updateAuthUI();return}if(!window.firebase){setAuthMessage('Firebase SDK를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.',true);return}try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();firebaseReady=true;auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(user=>{if(user)afterSignIn(user);else{cloudUser=null;cloudInitialized=false;updateAuthUI()}})}catch(e){console.error(e);setAuthMessage('Firebase 초기화 실패: '+(e.message||e),true)}}
function scheduleSave(){setStatus('저장 중…');clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}function setStatus(s){const e=$('saveStatus');if(e)e.textContent=s}
function notify(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2300)}
function activePage(){return state.pages.find(p=>p.id===state.activeId)||null}
function editorText(){const e=$('richEditor');return e?e.innerText:''}
function renderLists(){const q=$('searchInput').value.trim().toLowerCase(),filtered=state.pages.filter(p=>!q||(p.title+' '+contentToText(p.content)).toLowerCase().includes(q)),f=filtered.filter(p=>p.favorite);$('favoritesList').innerHTML='';$('pagesList').innerHTML='';if(!f.length){const n=document.createElement('div');n.className='small-note';n.textContent=q?'검색 결과 없음':'즐겨찾기가 없어요';$('favoritesList').append(n)}f.forEach(p=>$('favoritesList').append(makePageItem(p)));if(!filtered.length){const n=document.createElement('div');n.className='small-note';n.textContent='일치하는 페이지가 없어요';$('pagesList').append(n)}filtered.forEach(p=>$('pagesList').append(makePageItem(p)))}
function contentToText(content){const d=document.createElement('div');d.innerHTML=String(content||'');return d.innerText||d.textContent||''}
function makePageItem(p){const row=document.createElement('div');row.className='page-item'+(p.id===state.activeId?' active':'');row.tabIndex=0;row.setAttribute('role','button');const ic=document.createElement('span');ic.textContent=p.title.startsWith('☑ ')?'☑':'▤';const n=document.createElement('span');n.className='name';n.textContent=p.title||'제목 없음';row.append(ic,n);if(p.favorite){const st=document.createElement('span');st.className='star';st.textContent='★';row.append(st)}row.addEventListener('click',()=>selectPage(p.id));row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPage(p.id)}});return row}
function markdownToHtml(source){const lines=String(source||'').split(/\r?\n/);let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};for(let i=0;i<lines.length;i++){const l=lines[i];if(/^\s*\$\$\s*$/.test(l)){close();let a=[];i++;while(i<lines.length&&!/^\s*\$\$\s*$/.test(lines[i]))a.push(lines[i++]);const latex=a.join('\n');out+=`<p><span class="math-token" data-latex="${safeText(latex)}">\(${safeText(latex)}\)</span></p>`;continue}const task=l.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);if(task){close();out+=`<div class="task-row"><input type="checkbox" contenteditable="false" ${task[1].toLowerCase()==='x'?'checked':''}><span class="task-text" data-placeholder="할 일">${safeText(task[2])||'<br>'}</span></div>`;continue}const bullet=l.match(/^\s*[-*•]\s+(.*)$/),num=l.match(/^\s*\d+[.)]\s+(.*)$/);if(bullet||num){const type=bullet?'ul':'ol';if(list!==type){close();out+=`<${type}>`;list=type}out+=`<li>${safeText((bullet||num)[1])}</li>`;continue}close();if(!l.trim()){out+='<p><br></p>';continue}if(/^\s*>\s?/.test(l)){out+=`<blockquote>${safeText(l.replace(/^\s*>\s?/,''))}</blockquote>`;continue}out+=`<p>${safeText(l).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')||'<br>'}</p>`}close();return out||'<p><br></p>'}
function prepareStoredContent(content){if(!content)return '<p><br></p>';if(/<\s*(p|div|ul|ol|li|blockquote|h[1-6]|span|br)\b/i.test(content)){const t=document.createElement('template');t.innerHTML=content; t.content.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());t.content.querySelectorAll('[onload],[onclick],[onerror],[onmouseover]').forEach(n=>{n.removeAttribute('onload');n.removeAttribute('onclick');n.removeAttribute('onerror');n.removeAttribute('onmouseover')});t.content.querySelectorAll('.math-token').forEach(n=>{const latex=n.getAttribute('data-latex');if(latex!==null)n.textContent='\\('+latex+'\\)'});return t.innerHTML}return markdownToHtml(content)}
function renderEditor(){const p=activePage(),wrap=$('editorWrap');wrap.innerHTML='';if(!p){wrap.innerHTML='<div class="empty"><div><h2>아직 페이지가 없어요</h2><p>새 페이지 버튼을 눌러 첫 노트를 만들어 보세요.</p><button class="primary" id="emptyNewBtn">＋ 새 페이지</button></div></div>';$('emptyNewBtn').onclick=()=>createPage();return}
$('breadcrumb').textContent=p.title||'제목 없음';const head=document.createElement('div');head.className='editor-head';const icon=document.createElement('span');icon.className='page-icon';icon.textContent=p.title.startsWith('☑ ')?'☑':'📝';const title=document.createElement('input');title.className='title-input';title.value=p.title.replace(/^☑ /,'');title.placeholder='제목 없음';title.setAttribute('aria-label','페이지 제목');title.addEventListener('input',()=>{p.title=(p.title.startsWith('☑ ')?'☑ ':'')+title.value;p.updatedAt=now();$('breadcrumb').textContent=p.title||'제목 없음';renderLists();scheduleSave()});head.append(icon,title);wrap.append(head);
const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span class="save-dot"></span><span id="saveStatus">자동 저장됨</span><span>·</span><span>이 브라우저에 저장</span>';wrap.append(meta);
const toolbar=document.createElement('div');toolbar.className='toolbar';const add=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);toolbar.append(b)};
add('☑ 체크박스',()=>insertTask());add('• 글머리 기호',()=>document.execCommand('insertUnorderedList'));add('1. 번호 목록',()=>document.execCommand('insertOrderedList'));add('❞ 인용',()=>document.execCommand('formatBlock',false,'blockquote'));add('H 제목',()=>document.execCommand('formatBlock',false,'h2'));add('B 굵게',()=>document.execCommand('bold'));add('I 기울임',()=>document.execCommand('italic'));addColorSelect(toolbar,'🖍 형광펜', [['노랑','#fff176'],['분홍','#ffb7d5'],['초록','#b9f6ca'],['파랑','#b3e5fc'],['보라','#d7b8ff'],['없음','transparent']], 'hiliteColor');addColorSelect(toolbar,'A 글자 색', [['검정','#282824'],['빨강','#d32f2f'],['주황','#ef6c00'],['초록','#2e7d32'],['파랑','#1565c0'],['보라','#7b1fa2'],['분홍','#c2185b']], 'foreColor');add('∑ LaTeX',()=>insertLatex());add('날짜 삽입',()=>insertHtml(`<span>${new Date().toLocaleDateString('ko-KR')}</span>&nbsp;`));wrap.append(toolbar);
const editor=document.createElement('div');editor.className='editor';editor.id='richEditor';editor.contentEditable='true';editor.setAttribute('role','textbox');editor.setAttribute('aria-multiline','true');editor.setAttribute('aria-label','노트 내용');editor.dataset.placeholder='생각을 자유롭게 기록하세요…\n\n도구 모음에서 체크박스, 글머리 기호, 인용, 수식 등을 추가할 수 있어요.';editor.innerHTML=prepareStoredContent(p.content);wrap.append(editor);
editor.addEventListener('input',()=>{syncContent();if($('searchInput').value.trim())renderLists()});editor.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]'))syncContent()});editor.addEventListener('click',e=>{if(e.target.matches('input[type=checkbox]')){setTimeout(syncContent,0)}});editor.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;const sel=window.getSelection();const node=sel&&sel.anchorNode;const el=node?(node.nodeType===1?node:node.parentElement):null;const taskText=el&&editor.contains(el)?el.closest('.task-text'):null;if(taskText){e.preventDefault();const row=taskText.closest('.task-row');const next=document.createElement('div');next.className='task-row';next.innerHTML='<input type="checkbox" contenteditable="false"><span class="task-text" contenteditable="true" data-placeholder="할 일"><br></span>';row.after(next);placeCaret(next.querySelector('.task-text'));syncContent();return}if(el&&editor.contains(el)&&!el.closest('li,blockquote,.task-row')){e.preventDefault();document.execCommand('insertParagraph');syncContent()}});
const hint=document.createElement('div');hint.className='status';hint.style.marginTop='16px';hint.textContent='입력한 내용은 자동 저장됩니다. 수식은 ∑ LaTeX 버튼으로 삽입할 수 있어요.';wrap.append(hint);$('favoriteBtn').textContent=p.favorite?'★ 즐겨찾기 해제':'☆ 즐겨찾기';$('favoriteBtn').disabled=false;$('renameBtn').disabled=false;$('deleteBtn').disabled=false;typesetMath(editor)}
function syncContent(){const e=$('richEditor'),p=activePage();if(!e||!p)return;e.querySelectorAll('.math-token').forEach(n=>{const latex=n.getAttribute('data-latex');if(latex!==null&&!n.querySelector('.MathJax'))n.textContent='\\('+latex+'\\)'});e.querySelectorAll('.task-row input[type=checkbox]').forEach(cb=>{if(cb.checked)cb.setAttribute('checked','');else cb.removeAttribute('checked')});p.content=e.innerHTML;p.updatedAt=now();scheduleSave()}
function rememberEditorSelection(){const e=$('richEditor'),sel=window.getSelection();if(e&&sel&&sel.rangeCount&&e.contains(sel.anchorNode))savedEditorRange=sel.getRangeAt(0).cloneRange()}
function restoreEditorSelection(){const e=$('richEditor'),sel=window.getSelection();if(!e||!sel)return false;e.focus();if(savedEditorRange&&e.contains(savedEditorRange.commonAncestorContainer)){sel.removeAllRanges();sel.addRange(savedEditorRange);return true}return !!(sel.rangeCount&&e.contains(sel.anchorNode))}
function addColorSelect(toolbar,label,colors,command){const wrap=document.createElement('label');wrap.className='format-select';wrap.append(document.createTextNode(label+' '));const select=document.createElement('select');select.setAttribute('aria-label',label);select.innerHTML='<option value="">색 선택</option>'+colors.map(([name,color])=>`<option value="${color}">${name}</option>`).join('');select.addEventListener('mousedown',rememberEditorSelection);select.addEventListener('focus',rememberEditorSelection);select.addEventListener('change',()=>{
  if(!select.value)return;
  const color=select.value;
  const restored=restoreEditorSelection();
  const editor=$('richEditor');
  const selection=window.getSelection();
  if(command==='hiliteColor'){
    // 형광펜은 선택한 텍스트에만 적용하고, 이후 입력은 일반 글씨로 되돌립니다.
    if(restored && selection && selection.rangeCount && !selection.getRangeAt(0).collapsed){
      if(color==='transparent'){
        document.execCommand('hiliteColor',false,'transparent');
        document.execCommand('backColor',false,'transparent');
      }else{
        document.execCommand('hiliteColor',false,color);
      }
      const applied=window.getSelection();
      if(applied && applied.rangeCount){
        const endRange=applied.getRangeAt(0).cloneRange();
        endRange.collapse(false);
        applied.removeAllRanges();
        applied.addRange(endRange);
        // 커서에서 이어 쓰는 글에 형광펜이 계속 묻어나지 않도록 입력 서식을 초기화합니다.
        document.execCommand('hiliteColor',false,'transparent');
      }
      savedEditorRange=null;
      editor?.focus();
      syncContent();
    }else{
      notify('먼저 글에서 형광펜을 칠할 부분을 드래그해 선택해 주세요.');
      editor?.focus();
    }
  }else{
    if(restored)document.execCommand(command,false,color);
    syncContent();
  }
  select.value='';
});wrap.append(select);$('richEditor')?.addEventListener('keyup',rememberEditorSelection);$('richEditor')?.addEventListener('mouseup',rememberEditorSelection);toolbar.append(wrap)}
function placeCaret(node){node.focus();const r=document.createRange();r.selectNodeContents(node);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function insertHtml(html){const e=$('richEditor');if(!e)return;e.focus();const sel=getSelection();if(sel&&sel.rangeCount&&e.contains(sel.anchorNode)){const r=sel.getRangeAt(0);r.deleteContents();const f=r.createContextualFragment(html);const last=f.lastChild;r.insertNode(f);if(last){r.setStartAfter(last);r.collapse(true);sel.removeAllRanges();sel.addRange(r)}}else{e.insertAdjacentHTML('beforeend',html);placeCaret(e.lastElementChild||e)}syncContent();typesetMath(e)}
function insertTask(){insertHtml('<div class="task-row"><input type="checkbox" contenteditable="false"><span class="task-text" data-placeholder="할 일">할 일</span></div><p><br></p>');const e=$('richEditor');const tasks=e.querySelectorAll('.task-text');if(tasks.length)placeCaret(tasks[tasks.length-1])}
function insertLatex(){const latex=prompt('LaTeX 수식을 입력하세요. 예: \\frac{a}{b} 또는 x^2+y^2=z^2');if(latex===null||!latex.trim())return;insertHtml(`<span class="math-token" data-latex="${safeText(latex.trim())}">\\(${safeText(latex.trim())}\\)</span>&nbsp;`)}
function typesetMath(root){if(!window.MathJax||!window.MathJax.typesetPromise||!root)return;const tokens=root.querySelectorAll('.math-token');tokens.forEach(t=>{const latex=t.getAttribute('data-latex');if(latex!==null)t.textContent='\\('+latex+'\\)'});window.MathJax.typesetClear?.([root]);window.MathJax.typesetPromise([root]).catch(()=>{})}
function render(){renderLists();renderEditor()}function selectPage(id){syncContent();state.activeId=id;save();render();if(matchMedia('(max-width:720px)').matches)closeMenu()}
function createPage(content='',title='새 페이지'){syncContent();const p=makePage(title,content);state.pages.unshift(p);state.activeId=p.id;save();render();closeMenu();const t=document.querySelector('.title-input');if(t){t.focus();t.select()}notify('새 페이지를 만들었어요.')}
function createChecklist(){createPage('<div class="task-row"><input type="checkbox" contenteditable="false"><span class="task-text">첫 번째 할 일</span></div><div class="task-row"><input type="checkbox" contenteditable="false"><span class="task-text">두 번째 할 일</span></div>','☑ 체크리스트')}
function renamePage(){const p=activePage();if(!p)return;const v=prompt('새 페이지 이름을 입력하세요.',p.title.replace(/^☑ /,''));if(v===null)return;if(!v.trim()){notify('페이지 이름은 비워 둘 수 없어요.');return}p.title=(p.title.startsWith('☑ ')?'☑ ':'')+v.trim();p.updatedAt=now();save();render();notify('페이지 이름을 바꿨어요.')}
function deletePage(){const p=activePage();if(!p)return;if(!confirm('“'+p.title+'” 페이지를 삭제할까요?'))return;state.pages=state.pages.filter(x=>x.id!==p.id);if(!state.pages.length){const n=makePage('첫 번째 노트','');state.pages=[n]}state.activeId=state.pages[0].id;save();render();notify('페이지를 삭제했어요.')}
function toggleFavorite(){const p=activePage();if(!p)return;p.favorite=!p.favorite;save();render();notify(p.favorite?'즐겨찾기에 추가했어요.':'즐겨찾기에서 해제했어요.')}
function exportBackup(){syncContent();const blob=new Blob([JSON.stringify({format:'my-notes-backup',version:2,exportedAt:now(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-notes-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 내보냈어요.')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.pages)||!d.pages.every(p=>p&&typeof p.id==='string'&&typeof p.title==='string'))throw 0;if(!confirm('현재 노트를 백업 파일의 내용으로 교체할까요?'))return;state={pages:d.pages.map(p=>({id:p.id,title:p.title,content:String(p.content||''),favorite:!!p.favorite,createdAt:p.createdAt||now(),updatedAt:p.updatedAt||now()})),activeId:d.activeId||d.pages[0]?.id||null};if(!state.pages.length){const p=makePage();state.pages=[p];state.activeId=p.id}if(!state.pages.some(p=>p.id===state.activeId))state.activeId=state.pages[0].id;save();render();notify('백업을 가져왔어요.')}catch(e){notify('올바른 My Notes 백업 파일이 아니에요.')}};r.readAsText(file)}
function openMenu(){$('sidebar').classList.add('open');$('overlay').classList.add('show')}function closeMenu(){$('sidebar').classList.remove('open');$('overlay').classList.remove('show')}
